<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <section class="game-card">
      <header class="hero">
        <div class="badge">✦ MINI ARCADE</div>
        <h1>Rock <span>Paper</span> Scissors</h1>
        <p>Choose your move and challenge the computer.</p>
      </header>

      <section class="scoreboard">
        <div class="score">
          <span>You</span>
          <strong id="player-score">0</strong>
        </div>
        <div class="vs">VS</div>
        <div class="score">
          <span>Computer</span>
          <strong id="computer-score">0</strong>
        </div>
      </section>

      <section class="arena">
        <div class="fighter">
          <div class="label">YOUR MOVE</div>
          <div class="choice-display" id="player-choice">?</div>
        </div>

        <div class="result-wrap">
          <div class="result" id="result">Make your move!</div>
          <div class="round" id="round">First to 5 wins</div>
        </div>

        <div class="fighter">
          <div class="label">COMPUTER</div>
          <div class="choice-display" id="computer-choice">?</div>
        </div>
      </section>

      <section class="choices" aria-label="Choose your move">
        <button class="choice-btn" data-choice="rock">
          <span class="emoji">✊</span>
          <span>Rock</span>
        </button>
        <button class="choice-btn" data-choice="paper">
          <span class="emoji">✋</span>
          <span>Paper</span>
        </button>
        <button class="choice-btn" data-choice="scissors">
          <span class="emoji">✌️</span>
          <span>Scissors</span>
        </button>
      </section>

      <button class="reset-btn" id="reset-btn">↻ Reset Game</button>
    </section>
  </main>

  <div class="confetti" id="confetti"></div>
  <script src="script.js"></script>
</body>
</html>
